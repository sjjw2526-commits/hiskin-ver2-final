# Netlify reads this whether the site is deployed from the CLI or wired up to
# a git repo later, so both routes publish the same thing.
[build]
  command = "npm run build"
  publish = "out"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Short, revalidating cache — NOT a long max-age.
#
# Netlify applies these headers to 404s as well, and this project fills
# /images and /videos in gradually: anything still a placeholder answers 404.
# With a week-long max-age a visitor who arrived before a file existed kept
# the 404 for a week, so the real image stayed invisible to exactly the
# people who had already looked. (This is what made the certificate scans
# and ingredient shots appear missing after they had shipped.)
#
# 10 minutes, then revalidate: an unchanged file costs a 304, and a newly
# added one shows up for everyone within 10 minutes. Worth far more than
# the bytes saved on a B2B page this size. Once every asset is final this
# can go back up.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=600, must-revalidate"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=600, must-revalidate"
